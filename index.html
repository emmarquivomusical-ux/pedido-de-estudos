        // ================= RELÓGIO =================

            const segundos = String(now.getSeconds()).padStart(2, '0');
            const data = now.toLocaleDateString('pt-BR');
            const horaFormatada = `${horas}:${minutos}:${segundos}`;
            document.getElementById('digitalClock').innerHTML = `🕒 ${data} - ${horaFormatada}`;
            const topClock = document.getElementById('topClock');
            if (topClock) topClock.innerHTML = `🕒 ${data} - ${horaFormatada}`;
        }
        setInterval(atualizarRelogio, 1000);

        // ----- Funções de histórico (sem alterações) -----
        function carregarHistorico() {
            const stored = localStorage.getItem("historico_pedidos");

            localStorage.setItem("historico_pedidos", JSON.stringify(historicoPedidos));

        function adicionarPedido(nome, email, instrumento, grupo, obrasTitulos, obs = "") {
            listaPedidos.unshift({
                id: Date.now(),
                nome, email, instrumento, grupo,
                obras: obrasTitulos,
                observacao: obs,
                data: new Date().toLocaleString("pt-BR"),

            });

        }
        function limparTodosPedidos() {
            if (confirm("⚠️ Tem certeza que deseja LIMPAR TODOS OS PEDIDOS REGISTRADOS?")) {
                listaPedidos = [];
                salvarListaPedidos();
                mostrarToast("✅ Todos os pedidos foram removidos.");
            }
        }
        function exibirListaPedidos() {
            const container = document.getElementById("pedidosListContainer");
            const filtroGroup = document.getElementById("filterPedidosGroup").value;
            let pedidosFiltrados = [...listaPedidos];
            if (filtroGroup !== "todos") {
                const groupId = parseInt(filtroGroup);
                const groupName = GROUPS.find(g => g.id === groupId)?.name;
                if (groupName) pedidosFiltrados = pedidosFiltrados.filter(p => p.grupo === groupName);
            }
            if (!pedidosFiltrados.length) {
                container.innerHTML = "<p>Nenhum pedido encontrado.</p>";
                return;
            }
            container.innerHTML = "";
            pedidosFiltrados.forEach(p => {
                const div = document.createElement("div");
                div.className = "pedido-item";
                div.innerHTML = `
                    <div class="pedido-data">📅 ${p.data}</div>
                    <div class="pedido-info"><strong>👤 ${escapeHtml(p.nome)}</strong> (${escapeHtml(p.email)}) - 🎺 ${escapeHtml(p.instrumento)}</div>
                    <div class="pedido-info">🎭 Grupo: ${escapeHtml(p.grupo)}</div>
                    <div class="pedido-info">📚 Obras solicitadas (${p.obras.length}):<br>${p.obras.map(obra => `&nbsp;&nbsp;- ${escapeHtml(obra)}`).join("<br>")}</div>
                    ${p.observacao ? `<div class="pedido-info">📝 Obs: ${escapeHtml(p.observacao)}</div>` : ""}
                `;
                container.appendChild(div);
            });
            document.getElementById("pedidosModal").style.display = "flex";
        }

        function verificarPedidosDuplicados(email, obrasSelecionadasTitulos, diasLimite = 30) {
            const agora = Date.now();
            const limiteMs = diasLimite * 24 * 60 * 60 * 1000;
            const duplicadas = [];
            for (const titulo of obrasSelecionadasTitulos) {
                const chave = `${email}|${titulo}`;
                const ultimoPedido = historicoPedidos[chave];
                if (ultimoPedido && (agora - ultimoPedido) < limiteMs) duplicadas.push(titulo);
            }
            return duplicadas;
        }
        function registrarPedidoDuplicata(email, obrasSelecionadasTitulos) {
            const agora = Date.now();
            for (const titulo of obrasSelecionadasTitulos) {
                historicoPedidos[`${email}|${titulo}`] = agora;
            }
            salvarHistorico();
        }
        function limparHistoricoCompleto() {
            if (confirm("⚠️ Tem certeza que deseja LIMPAR TODO o histórico de duplicatas?")) {
                historicoPedidos = {};
                salvarHistorico();
                mostrarToast("✅ Histórico de duplicatas limpo com sucesso!");
            }
        }
        function limparHistoricoPorGrupo() {
            const grupo = adminSelectedGroupId;
            const obrasDoGrupo = obras.filter(o => o.groupId === grupo).map(o => o.titulo);
            if (!obrasDoGrupo.length) {
                mostrarToast("Nenhuma obra neste grupo.", true);
                return;
            }
            if (confirm(`⚠️ Limpar histórico de duplicatas para "${GROUPS.find(g => g.id === grupo)?.name}"?`)) {
                let removidos = 0;
                for (const chave in historicoPedidos) {
                    const titulo = chave.split('|')[1];
                    if (obrasDoGrupo.includes(titulo)) {
                        delete historicoPedidos[chave];
                        removidos++;
                    }
                }
                salvarHistorico();
                mostrarToast(`✅ Histórico limpo para ${removidos} registro(s).`);
            }
        }

        function loadData() {
            const stored = localStorage.getItem("musical_obras");
            const versaoAtual = localStorage.getItem("versao_obras");
            if (stored && versaoAtual === VERSAO_OBRAS) {
                obras = JSON.parse(stored);
            } else {
                obras = getDefaultObras();
                saveObras();
                localStorage.setItem("versao_obras", VERSAO_OBRAS);
            }
            if (document.getElementById("formspreeEndpoint")) document.getElementById("formspreeEndpoint").value = FORMSPREE_ENDPOINT;
            carregarHistorico();
            carregarListaPedidos();
        }
        function saveObras() {
            localStorage.setItem("musical_obras", JSON.stringify(obras));
            localStorage.setItem("versao_obras", VERSAO_OBRAS);
        }
        function resetToDefaultObras() {
            if (confirm("⚠️ Isso vai apagar todas as obras atuais e restaurar as originais. Deseja continuar?")) {
                obras = getDefaultObras();
                saveObras();
                localStorage.setItem("versao_obras", VERSAO_OBRAS);
                renderWorksByGroup(currentGroupId);
                if (isAdmin) renderAdminWorksList();
                mostrarToast("Obras restauradas com sucesso!");
            }
        }

        // ================= ADMIN =================
        function renderAdminGroups() {
            if (!isAdmin) return;
            const cont = document.getElementById("adminGroupSelector");
            cont.innerHTML = "";
            GROUPS.forEach(g => {
                const btn = document.createElement("button");
                btn.innerText = g.name;
                btn.className = `admin-btn ${adminSelectedGroupId === g.id ? 'active' : ''}`;
                btn.onclick = () => { adminSelectedGroupId = g.id; renderAdminGroups(); renderAdminWorksList(); };
                cont.appendChild(btn);
            });
        }

        function renderAdminWorksList() {
            const filtered = obras.filter(o => o.groupId === adminSelectedGroupId);
            const ul = document.getElementById("adminWorksList");
            ul.innerHTML = "";
            filtered.forEach(o => {
                const li = document.createElement("li");
                li.innerHTML = `<span><strong>${escapeHtml(o.titulo)}</strong> ${o.compositor ? `– ${escapeHtml(o.compositor)}` : ''} ${o.audioUrl ? '🎵' : ''}</span>
                                <div class="work-actions">
                                    <button class="edit-work" data-id="${o.id}">✏️ Editar</button>
                                    <button class="delete-work" data-id="${o.id}">🗑️</button>
                                </div>`;
                ul.appendChild(li);
            });
            document.querySelectorAll(".edit-work").forEach(btn => btn.onclick = () => abrirEdicao(parseInt(btn.dataset.id)));
            document.querySelectorAll(".delete-work").forEach(btn => btn.onclick = () => { if (confirm("Remover obra?")) { obras = obras.filter(o => o.id !== parseInt(btn.dataset.id)); saveObras(); renderAdminWorksList(); if (currentGroupId === adminSelectedGroupId) renderWorksByGroup(currentGroupId); } });
        }

        function abrirEdicao(id) {
            const obra = obras.find(o => o.id === id);
            if (!obra) return;
            editingWorkId = id;
            document.getElementById("editTitulo").value = obra.titulo;
            document.getElementById("editCompositor").value = obra.compositor || "";
            document.getElementById("editAudio").value = obra.audioUrl || "";
            // Preencher o select de instrumentos
            const selectInst = document.getElementById("editInstrumentos");
            const instrumentosDoGrupo = INSTRUMENTOS_POR_GRUPO[adminSelectedGroupId] || [];
            selectInst.innerHTML = "";
            instrumentosDoGrupo.forEach(inst => {
                const opt = document.createElement("option");
                opt.value = inst;
                opt.textContent = inst;
                if (obra.instrumentos && obra.instrumentos.includes(inst)) opt.selected = true;
                selectInst.appendChild(opt);
            });
            document.getElementById("editWorkModal").style.display = "flex";
        }

        function salvarEdicao() {
            if (editingWorkId === null) return;
            const idx = obras.findIndex(o => o.id === editingWorkId);
            if (idx === -1) return;
            const selectInst = document.getElementById("editInstrumentos");
            const instrumentosSelecionados = Array.from(selectInst.selectedOptions).map(opt => opt.value);
            obras[idx].titulo = document.getElementById("editTitulo").value.trim() || "Sem título";
            obras[idx].compositor = document.getElementById("editCompositor").value.trim() || "";
            obras[idx].audioUrl = document.getElementById("editAudio").value.trim() || "";
            obras[idx].instrumentos = instrumentosSelecionados.length ? instrumentosSelecionados : ["Todos"];
            saveObras();
            renderAdminWorksList();
            if (currentGroupId === obras[idx].groupId) renderWorksByGroup(currentGroupId);
            document.getElementById("editWorkModal").style.display = "none";
        }

        function addWork() {
            const tit = document.getElementById("novaObraTitulo").value.trim();
            if (!tit) return;
            const audio = document.getElementById("novaObraAudio").value.trim() || "";
            const selectInst = document.getElementById("novaObraInstrumentos");
            const instrumentosSelecionados = Array.from(selectInst.selectedOptions).map(opt => opt.value);
            obras.push({
                id: Date.now(),
                titulo: tit,
                compositor: document.getElementById("novaObraCompositor").value.trim() || "",
                instrumentos: instrumentosSelecionados.length ? instrumentosSelecionados : ["Todos"],
                audioUrl: audio,
                groupId: adminSelectedGroupId
            });
            saveObras();
            renderAdminWorksList();
            if (currentGroupId === adminSelectedGroupId) renderWorksByGroup(currentGroupId);
            document.getElementById("novaObraTitulo").value = "";
            document.getElementById("novaObraCompositor").value = "";
            document.getElementById("novaObraAudio").value = "";
            // Limpar seleção do select
            Array.from(document.getElementById("novaObraInstrumentos").selectedOptions).forEach(opt => opt.selected = false);
        }

        // ================= RENDER PARA O MÚSICO =================
        function renderGroups() {
            const container = document.getElementById("groupsContainer");
            container.innerHTML = "";
            GROUPS.forEach(g => {
                const div = document.createElement("div");
                div.className = `group-card ${currentGroupId === g.id ? 'active' : ''}`;
                div.innerText = g.name;
                div.onclick = () => {
                    currentGroupId = g.id;
                    renderGroups();
                    renderWorksByGroup(g.id);
                    updateGroupTitle(g.name);
                    atualizarDatalistInstrumentos(g.id);
                    document.getElementById("selectAllCheckbox").checked = false;
                    // Limpar filtro de instrumento
                    document.getElementById("musicoInstrumento").value = "";
                    mostrarTodasObras();
                };
                container.appendChild(div);
            });
        }

        function updateGroupTitle(name) {
            document.getElementById("currentGroupTitle").innerHTML = `🎼 ${name} · Obras do repertório (selecione apenas a obra desejada)`;
        }

        // Função para mostrar todas as obras (quando o instrumento estiver vazio)
        function mostrarTodasObras() {
            const items = document.querySelectorAll("#worksList .work-item");
            items.forEach(item => item.style.display = "flex");
        }

        function renderWorksByGroup(gid) {
            const worksDiv = document.getElementById("worksList");
            const filtered = obras.filter(o => o.groupId === gid);
            if (!filtered.length) {
                worksDiv.innerHTML = "<div class='empty-works'>Nenhuma obra disponível neste repertório.</div>";
                return;
            }
            worksDiv.innerHTML = "";
            filtered.forEach(obra => {
                const item = document.createElement("div");
                item.className = "work-item";
                const hasAudio = obra.audioUrl && obra.audioUrl.trim() !== "";
                item.innerHTML = `
                    <input type="checkbox" class="obra-checkbox" data-id="${obra.id}" data-titulo="${escapeHtml(obra.titulo)}" data-compositor="${escapeHtml(obra.compositor || '')}">
                    <div class="work-info">
                        <h3>${escapeHtml(obra.titulo)}</h3>
                        <p>${escapeHtml(obra.compositor || "Compositor não informado")}</p>
                    </div>
                    <div class="work-audio">
                        ${hasAudio ? `<audio controls preload="none" style="max-width:120px; height:28px;"><source src="${escapeHtml(obra.audioUrl)}" type="audio/mpeg">Seu navegador não suporta áudio.</audio>` : `<span style="font-size:0.7rem;color:#999;">Sem áudio</span>`}
                    </div>
                `;
                worksDiv.appendChild(item);
            });

            // Aplicar filtro atual (se houver instrumento digitado)
            const instrumentoAtual = document.getElementById("musicoInstrumento").value.trim().toLowerCase();
            if (instrumentoAtual) {
                aplicarFiltroInstrumento(instrumentoAtual);
            }

            // Evento do "Selecionar todos"
            const selectAll = document.getElementById("selectAllCheckbox");
            if (selectAll) {
                selectAll.onchange = (e) => {
                    const checkboxes = document.querySelectorAll("#worksList .obra-checkbox");
                    checkboxes.forEach(cb => cb.checked = e.target.checked);
                };
            }
        }

        // Função de filtro por instrumento
        function aplicarFiltroInstrumento(instrumento) {
            const items = document.querySelectorAll("#worksList .work-item");
            if (!instrumento) {
                items.forEach(item => item.style.display = "flex");
                return;
            }
            const instLower = instrumento.toLowerCase();
            items.forEach(item => {
                const checkbox = item.querySelector(".obra-checkbox");
                const obraId = parseInt(checkbox.dataset.id);
                const obra = obras.find(o => o.id === obraId);
                if (!obra) return;
                // Verifica se a obra tem o instrumento (ou "Todos")
                const temInstrumento = obra.instrumentos.some(inst => inst.toLowerCase().includes(instLower));
                item.style.display = temInstrumento ? "flex" : "none";
            });
        }

        // Atualiza o datalist de instrumentos (já existente)
        function atualizarDatalistInstrumentos(groupId) {
            const datalist = document.getElementById("instrumentosDinamico");
            if (!datalist) return;
            const instrumentos = INSTRUMENTOS_POR_GRUPO[groupId] || INSTRUMENTOS_POR_GRUPO[2];
            datalist.innerHTML = "";
            instrumentos.forEach(inst => {
                const option = document.createElement("option");
                option.value = inst;
                datalist.appendChild(option);
            });
        }

        function validarEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        let enviando = false;

        async function enviarPedido() {
            if (enviando) {
                mostrarToast("Aguarde, processando o pedido...", false);
                return;
            }

            const nome = document.getElementById("musicoNome").value.trim();
            const email = document.getElementById("musicoEmail").value.trim();
            const instrumento = document.getElementById("musicoInstrumento").value.trim();
            const obs = document.getElementById("obs").value.trim();

            if (!nome) { mostrarToast("Preencha seu nome.", true); return; }
            if (!email) { mostrarToast("Preencha seu e-mail.", true); return; }
            if (!validarEmail(email)) { mostrarToast("Digite um e-mail válido.", true); return; }
            if (!instrumento) { mostrarToast("Preencha seu instrumento.", true); return; }

            const checkboxes = document.querySelectorAll("#worksList .obra-checkbox:checked");
            if (checkboxes.length === 0) {
                mostrarToast("Selecione pelo menos uma obra.", true);
                return;
            }

            const obrasSelecionadas = [];
            const titulos = [];
            const instrumentoLower = instrumento.toLowerCase();

            checkboxes.forEach(cb => {
                const obraId = parseInt(cb.dataset.id);
                const obra = obras.find(o => o.id === obraId);
                if (!obra) return;
                // Verifica se o instrumento é compatível
                const compativel = obra.instrumentos.some(inst => inst.toLowerCase().includes(instrumentoLower));
                if (!compativel) {
                    mostrarToast(`❌ O instrumento "${instrumento}" não está disponível para a obra "${obra.titulo}".`, true);
                    return;
                }
                obrasSelecionadas.push(obra);
                titulos.push(obra.titulo);
            });

            if (obrasSelecionadas.length === 0) return;

            // Verificar duplicatas
            const duplicadas = verificarPedidosDuplicados(email, titulos, 30);
            if (duplicadas.length > 0) {
                const lista = duplicadas.map(t => `- ${t}`).join("\n");
                mostrarToast(`❌ Você já solicitou as seguintes obras nos últimos 30 dias:\n${lista}\n\nPor favor, não repita pedidos.`, true);
                return;
            }

            const grupoAtual = GROUPS.find(g => g.id === currentGroupId)?.name || "Grupo";
            const obrasTexto = obrasSelecionadas.map(o => `- ${o.titulo}${o.compositor ? ` (${o.compositor})` : ''}`).join("\n");
            const corpo = `Músico: ${nome}\nE-mail: ${email}\nInstrumento: ${instrumento}\nGrupo: ${grupoAtual}\n\nObras solicitadas (${checkboxes.length}):\n${obrasTexto}\n\nObservações: ${obs || "Nenhuma"}`;

            enviando = true;
            const btn = document.getElementById("enviarPedidoBtn");
            btn.disabled = true;
            btn.textContent = "Enviando...";

            try {
                const resposta = await fetch(FORMSPREE_ENDPOINT, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        nome, email, instrumento, grupo: grupoAtual,
                        obras: obrasTexto,
                        observacoes: obs,
                        _subject: `Pedido de Estudo - ${nome} - ${grupoAtual}`
                    })
                });
                if (resposta.ok) {
                    registrarPedidoDuplicata(email, titulos);
                    adicionarPedido(nome, email, instrumento, grupoAtual, titulos, obs);
                    mostrarToast(`✅ Pedido enviado! ${checkboxes.length} obra(s) solicitada(s). O arquivista receberá por e-mail.\n\n📌 Lembrete: O Material estará disponível no dia seguinte.`);
                    document.querySelectorAll("#worksList .obra-checkbox").forEach(cb => cb.checked = false);
                    document.getElementById("selectAllCheckbox").checked = false;
                    document.getElementById("musicoNome").value = "";
                    document.getElementById("musicoEmail").value = "";
                    document.getElementById("musicoInstrumento").value = "";
                    document.getElementById("obs").value = "";
                    // Reaplicar o filtro (para mostrar todas as obras novamente)
                    mostrarTodasObras();
                } else {
                    mostrarToast("❌ Erro ao enviar. Tente novamente.", true);
                }
            } catch (erro) {
                console.error(erro);
                mostrarToast("Erro de conexão. Verifique sua internet.", true);
            } finally {
                enviando = false;
                btn.disabled = false;
                btn.textContent = "📨 Enviar Pedido";
            }
        }

        function mostrarToast(msg, isError = false) {
            const toast = document.getElementById("toastMsg");
            toast.textContent = msg;
            toast.className = `toast ${isError ? 'error' : ''}`;
            toast.style.opacity = "1";
            setTimeout(() => { toast.style.opacity = "0"; }, 6000);
        }

        function escapeHtml(str) {
            if (!str) return "";
            return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
        }

        // ============================================================
        //  INICIALIZAÇÃO
        // ============================================================
        function init() {
            // Verificação de versão do APP
            const versaoAppSalva = localStorage.getItem("versao_app");
            if (versaoAppSalva !== VERSAO_APP) {
                localStorage.setItem("versao_app", VERSAO_APP);
                if ('caches' in window) {
                    caches.keys().then(names => names.forEach(name => caches.delete(name)));
                }
                window.location.reload(true);
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            isAdmin = urlParams.get('admin') === ADMIN_SECRET_KEY;
            if (!isAdmin && sessionStorage.getItem('admin_logged') === 'true') isAdmin = true;
            if (isAdmin) sessionStorage.setItem('admin_logged', 'true');
            else document.getElementById('adminToggleBtn').style.display = 'none';

            loadData();

            renderGroups();
            renderWorksByGroup(0);
            updateGroupTitle(GROUPS[0].name);
            atualizarDatalistInstrumentos(0);

            // Evento de filtro no campo instrumento
            document.getElementById("musicoInstrumento").addEventListener("input", function() {
                const instrumento = this.value.trim().toLowerCase();
                aplicarFiltroInstrumento(instrumento);
            });

            document.getElementById("enviarPedidoBtn").onclick = enviarPedido;
            document.getElementById("adminToggleBtn").onclick = () => { if (isAdmin) document.getElementById("adminModal").style.display = "flex"; else alert("Acesso restrito."); };
            document.getElementById("closeAdminBtn").onclick = () => document.getElementById("adminModal").style.display = "none";
            document.getElementById("logoutAdminBtn").onclick = () => { sessionStorage.removeItem('admin_logged'); location.href = location.pathname; };
            document.getElementById("confirmEditBtn").onclick = salvarEdicao;
            document.getElementById("cancelEditBtn").onclick = () => document.getElementById("editWorkModal").style.display = "none";
            document.getElementById("addWorkBtn").onclick = addWork;
            document.getElementById("saveEndpointBtn").onclick = () => {
                const newEp = document.getElementById("formspreeEndpoint").value.trim();
                if (newEp && newEp.startsWith("https://formspree.io/f/")) {
                    localStorage.setItem("formspree_endpoint", newEp);
                    mostrarToast("Endpoint salvo. Reinicie a página para aplicar.");
                } else alert("Endpoint inválido.");
            };
            document.getElementById("resetWorksBtn").onclick = resetToDefaultObras;

            document.getElementById("clearHistoryGroupBtn").onclick = limparHistoricoPorGrupo;
            document.getElementById("clearHistoryAllBtn").onclick = limparHistoricoCompleto;

            document.getElementById("viewPedidosBtn").onclick = exibirListaPedidos;
            document.getElementById("clearAllPedidosBtn").onclick = limparTodosPedidos;
            document.getElementById("closePedidosModalBtn").onclick = () => document.getElementById("pedidosModal").style.display = "none";
            document.getElementById("refreshPedidosList").onclick = exibirListaPedidos;

            // Preencher selects de instrumentos no admin (para nova obra)
            const selectNovo = document.getElementById("novaObraInstrumentos");
            if (selectNovo) {
                // Será preenchido quando o admin selecionar um grupo
                const updateSelect = () => {
                    const instrumentos = INSTRUMENTOS_POR_GRUPO[adminSelectedGroupId] || [];
                    selectNovo.innerHTML = "";
                    instrumentos.forEach(inst => {
                        const opt = document.createElement("option");
                        opt.value = inst;
                        opt.textContent = inst;
                        selectNovo.appendChild(opt);
                    });
                };
                // Atualiza quando o grupo admin mudar
                const observer = new MutationObserver(() => updateSelect());
                // Ou chamar na renderização do admin
                const origRenderAdminGroups = renderAdminGroups;
                renderAdminGroups = function() {
                    origRenderAdminGroups();
                    updateSelect();
                };
                // Inicializar
                setTimeout(updateSelect, 100);
            }

            if (isAdmin) {
                document.getElementById("adminToggleBtn").style.display = "block";
                adminSelectedGroupId = 0;
                renderAdminGroups();
                renderAdminWorksList();
                document.getElementById("formspreeEndpoint").value = FORMSPREE_ENDPOINT;
            }

            window.onclick = (e) => {
                if (e.target === document.getElementById("adminModal")) document.getElementById("adminModal").style.display = "none";
                if (e.target === document.getElementById("editWorkModal")) document.getElementById("editWorkModal").style.display = "none";
                if (e.target === document.getElementById("pedidosModal")) document.getElementById("pedidosModal").style.display = "none";
            };
        }

        init();
    </script>
</body>
</html>
